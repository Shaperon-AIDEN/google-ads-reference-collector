<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <style>
      body { width: 360px; font: 13px/1.5 -apple-system, sans-serif; margin: 0; padding: 12px; }
      h1 { font-size: 14px; margin: 0 0 8px; }
      label { display: block; margin: 6px 0 2px; color: #444; font-size: 12px; }
      input { width: 100%; box-sizing: border-box; padding: 5px 7px; border: 1px solid #ccc; border-radius: 6px; }
      .row { display: flex; gap: 8px; }
      .row > * { flex: 1; }
      button { margin-top: 10px; width: 100%; padding: 8px; border: 0; border-radius: 6px; background: #1a73e8; color: #fff; font-weight: 600; cursor: pointer; }
      button.sec { background: #eef; color: #1a73e8; }
      #advertisers { border: 1px solid #eee; border-radius: 6px; padding: 6px; max-height: 130px; overflow: auto; margin-top: 4px; }
      #advertisers label { display: flex; align-items: center; gap: 6px; margin: 2px 0; }
      #advertisers input { width: auto; }
      #log { margin-top: 10px; border-top: 1px solid #eee; padding-top: 8px; max-height: 160px; overflow: auto; font-size: 11px; color: #333; white-space: pre-wrap; }
      .muted { color: #888; font-size: 11px; }
    </style>
  </head>
  <body>
    <h1>Ad Reference Collector</h1>
    <label>백엔드 주소 (Functions)</label>
    <input id="ingestBase" placeholder="http://localhost:7071/api" />
    <div class="row">
      <div><label>페이지당(num)</label><input id="num" type="number" value="40" /></div>
      <div><label>요청 간격(ms)</label><input id="delayMs" type="number" value="1200" /></div>
      <div><label>region</label><input id="region" value="KR" /></div>
    </div>

    <div class="row" style="margin-top:8px">
      <button class="sec" id="load">경쟁사 불러오기</button>
      <button class="sec" id="useCurrent">현재 페이지 광고주</button>
    </div>
    <div id="advertisers"><span class="muted">"경쟁사 불러오기"로 목록을 가져오세요.</span></div>

    <button id="start">수집 시작</button>
    <div id="log"></div>

    <script src="popup.js"></script>
  </body>
</html>
